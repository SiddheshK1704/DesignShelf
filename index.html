<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Design Shelf: a reference library for designers. Find any reference by feel." />
    <meta name="color-scheme" content="dark light" />
    <title>Design Shelf</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the theme before first paint so there is no flash. Dark is the default.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('designshelf.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
